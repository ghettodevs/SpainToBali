version: '3.8'

services:
  db:
    image: postgres:15
    container_name: spaintobali_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5432:5432"
    volumes:
      - ./sql/database.sql:/docker-entrypoint-initdb.d/database.sql

  php-apache:
    build: .
    container_name: spaintobali_php
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    depends_on:
      - db